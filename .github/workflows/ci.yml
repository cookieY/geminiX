name: frontend-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  signature:
    name: Verify commit signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SEC-0025: pinned)
        with:
          # SEC-0014: full history keeps the protected origin/main ref
          # available for reading the allowed_signers trust root.
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the branch commit against the approved signing key
        run: |
          # SEC-0014: the allowed_signers trust root must come from the
          # protected origin/main ref, never from the PR-controlled working
          # tree (a PR that edits .github/allowed_signers must not be able to
          # bootstrap its own signing key into trust).
          git show origin/main:.github/allowed_signers > "$RUNNER_TEMP/allowed_signers"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed_signers"
          # pull_request checkouts are unsigned GitHub merge commits; verify
          # the actual PR head commit instead.
          git verify-commit "${{ github.event.pull_request.head.sha || 'HEAD' }}"

  action-pinning:
    name: Forbid floating action refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SEC-0025: pinned)
        with:
          persist-credentials: false
      - name: "Assert every uses: is pinned to a 40-hex commit SHA"
        run: |
          # SEC-0025: a floating tag can be repointed upstream; only commit
          # SHA pins make this CI supply chain auditable. The pattern is
          # anchored so this check never matches its own literal text.
          floating=$(grep -RnE '^[[:space:]]*-[[:space:]]*uses:[[:space:]]*[^[:space:]]+@' .github/workflows/ \
            | grep -vE 'uses:[[:space:]]*[^[:space:]]+@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$floating" ]; then
            echo "floating (non-40-hex-SHA) action reference(s) found:"
            echo "$floating"
            exit 1
          fi
          echo "all workflow action references are commit-SHA pinned"

  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SEC-0025: pinned)
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (SEC-0025: pinned)
        with:
          package_json_file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (SEC-0025: pinned)
        with:
          node-version-file: .github/node.version
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests with coverage
        run: pnpm test:coverage
      - name: Static machine gates (i18n, token contrast, raw colors, prohibited, assets, browser storage, motion)
        run: |
          pnpm check:i18n
          pnpm check:tokens
          pnpm check:colors
          pnpm check:prohibited
          pnpm check:assets
          pnpm check:storage
          pnpm check:motion
      - name: Contract suite (generated client + zod against the mock layer)
        run: pnpm test:contract
      - name: Registry inventory check (network required; separate from the offline build proof)
        run: pnpm check:registry

  build-offline:
    name: Offline build proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SEC-0025: pinned)
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (SEC-0025: pinned)
        with:
          package_json_file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (SEC-0025: pinned)
        with:
          node-version-file: .github/node.version
          cache: pnpm
      - name: Install (frozen lockfile, network available only for the registry)
        run: pnpm install --frozen-lockfile
      - name: Build with all egress blackholed
        env:
          HTTP_PROXY: http://127.0.0.1:1
          HTTPS_PROXY: http://127.0.0.1:1
          ALL_PROXY: http://127.0.0.1:1
          NO_PROXY: ""
          NODE_USE_ENV_PROXY: "1"
        run: |
          pnpm build
          echo "build completed with Node proxy enforcement pointed at a blackhole plus the local-resource assertion below"
      - name: Assert the built document references only local resources
        run: |
          # Library error strings legitimately mention doc sites; the gate is
          # about loaded resources, not string literals.
          external=$(grep -oE '(src|href)="https?://[^"]*"' dist/index.html || true)
          if [ -n "$external" ]; then
            echo "external resource reference in dist/index.html: $external"; exit 1
          fi
          echo "dist/index.html references only same-origin bundle assets"
      - name: Bundle budget gate (release transfer budget, admin/Monaco/mock isolation)
        run: pnpm check:bundle

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (SEC-0025: pinned)
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (SEC-0025: pinned)
        with:
          package_json_file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (SEC-0025: pinned)
        with:
          node-version-file: .github/node.version
          cache: pnpm
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e
        run: pnpm test:e2e
      - name: Run frame budget (single worker)
        run: pnpm test:frames
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (SEC-0025: pinned)
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
